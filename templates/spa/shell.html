{% load static vite siteicon %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ SITE_NAME }} — {{ SITE_TAGLINE }}</title>
<meta name="description" content="{{ SEO_DESC }}">
<meta name="robots" content="{% if noindex %}noindex, nofollow{% else %}index, follow, max-image-preview:large, max-snippet:-1{% endif %}">
{% if GOOGLE_SITE_VERIFICATION %}<meta name="google-site-verification" content="{{ GOOGLE_SITE_VERIFICATION }}">
{% endif %}<link rel="canonical" href="{{ SEO_CANONICAL }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ SITE_NAME }}">
<meta property="og:locale" content="{{ SEO_LOCALE }}">
<meta property="og:title" content="{% if og_title %}{{ og_title }}{% else %}{{ SITE_NAME }} — {{ SITE_TAGLINE }}{% endif %}">
<meta property="og:description" content="{{ og_desc|default:SEO_DESC }}">
<meta property="og:url" content="{{ SEO_CANONICAL }}">
<meta property="og:image" content="{{ og_image|default:SEO_IMAGE }}">
<meta property="og:image:secure_url" content="{{ og_image|default:SEO_IMAGE }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if og_title %}{{ og_title }}{% else %}{{ SITE_NAME }} — {{ SITE_TAGLINE }}{% endif %}">
<meta name="twitter:description" content="{{ og_desc|default:SEO_DESC }}">
<meta name="twitter:image" content="{{ og_image|default:SEO_IMAGE }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="{% site_icon_href 'images/site-icon.png' %}" type="image/png">
<link rel="apple-touch-icon" href="{% site_icon_href 'images/site-icon.png' %}">
<meta name="theme-color" content="#032a31">
{% vite_assets %}
</head>
<body>
<div id="root"></div>
{{ boot|json_script:"boot-data" }}
<noscript>هذا الموقع يحتاج تفعيل JavaScript.</noscript>
</body>
</html>
